<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<title>{{DEVICE}}</title>
<style>
  /* One theme, the app's own: a dark cinema palette shared by the TV and this page. */
  :root {
    --bg: #07080a; --card: #15171c; --card2: #1c1f26; --label: #f2f4f7; --secondary: #8b93a0; --tertiary: rgba(255,255,255,.32);
    --sep: rgba(255,255,255,.07); --tint: #5b8cff; --fill: rgba(255,255,255,.07); --danger: #ff5a52;
    --bar: rgba(18,20,25,.86); --bar-line: rgba(255,255,255,.08); --scrim: rgba(0,0,0,.6); --sheet: #101216;
    --grad: linear-gradient(135deg, #3aa0ff, #6a4cff); --hair: rgba(255,255,255,.06);
    --ease-out: cubic-bezier(.23,1,.32,1); --ease-drawer: cubic-bezier(.32,.72,0,1);
    --tabbar: calc(74px + env(safe-area-inset-bottom));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--label);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "MiSans", system-ui, sans-serif;
  }
  button { font: inherit; color: inherit; }
  /* A display rule would otherwise show what is hidden. */
  [hidden] { display: none !important; }

  main { max-width: 720px; margin: 0 auto; padding: env(safe-area-inset-top) 16px calc(var(--tabbar) + 26px); counter-reset: sec; }
  header { padding: 22px 4px 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 0 10px; }
  header h1 { order: 2; flex: 1 1 auto; min-width: 0; font-size: 25px; font-weight: 700; letter-spacing: -.02em; margin: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header h1::before {
    content: ""; display: inline-block; width: 21px; height: 21px; border-radius: 7px; margin-right: 9px;
    background: var(--grad); vertical-align: -2px;
  }
  header .back { order: 1; flex: 0 0 auto; }
  header p { order: 3; flex: 1 1 100%; margin: 7px 0 0 30px; color: var(--secondary); font-size: 12.5px; }
  header p::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px;
    background: #31d158; box-shadow: 0 0 7px #31d158; vertical-align: 1px;
  }

  h2 { counter-increment: sec; font-size: 12.5px; font-weight: 700; letter-spacing: .02em; color: var(--secondary);
    margin: 34px 4px 14px; display: flex; align-items: baseline; gap: 8px; }
  h2::before {
    content: counter(sec, decimal-leading-zero); flex: 0 0 auto; color: var(--tint); font-size: 11.5px; font-weight: 700;
    letter-spacing: .1em; font-variant-numeric: tabular-nums;
  }
  h2 i { font-style: normal; }
  h2.big { counter-increment: none; display: block; font-size: 19px; font-weight: 700; letter-spacing: -.01em; color: var(--label); margin: 26px 4px 10px; }
  h2.big::before { content: none; }
  .foot { color: var(--secondary); font-size: 13px; margin: 11px 4px 0; }
  .foot .link { font-size: 13px; }
  #sections .foot { margin: 10px 4px 0; }
  .list + .list { margin-top: 16px; }
  section > .list:first-child, section > .hero:first-child { margin-top: 14px; }

  /* Inset grouped list, as in iOS Settings. */
  .list { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid var(--hair); }
  .item {
    position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 14px 16px;
    border: 0; background: none; text-align: left; transition: background-color .2s ease;
  }
  .item + .item::before { content: ""; position: absolute; top: 0; left: 16px; right: 16px; height: 1px; background: var(--sep); }
  button.item:active, label.item:active { background: var(--fill); transition-duration: 0s; }
  .item .txt { flex: 1 1 auto; min-width: 0; }
  .item .sub { display: block; font-size: 12.5px; color: var(--secondary); margin-top: 3px; line-height: 1.4; }
  .item .val { color: var(--secondary); white-space: nowrap; max-width: 56%; overflow: hidden; text-overflow: ellipsis; }
  .item .chev { color: var(--tertiary); flex-shrink: 0; }
  .item.tint { color: var(--tint); }
  .item.danger { color: var(--danger); }
  .item.center { justify-content: center; font-weight: 500; }
  .item .thumb { width: 64px; aspect-ratio: 16 / 9; border-radius: 6px; object-fit: cover; background: var(--fill); flex-shrink: 0; }
  .item:has(.thumb) + .item::before { left: 92px; }
  .tick { color: var(--tint); flex-shrink: 0; opacity: 0; transform: scale(.8); transition: opacity .15s ease, transform .2s var(--ease-out); }
  [aria-checked="true"] .tick { opacity: 1; transform: none; }
  .item[disabled] { opacity: .5; }
  .item select { position: absolute; inset: 0; opacity: 0; width: 100%; font-size: 16px; }
  .switch {
    appearance: none; -webkit-appearance: none; position: relative; flex-shrink: 0; width: 46px; height: 28px; margin: 0;
    border-radius: 99px; background: rgba(255,255,255,.12); cursor: pointer; transition: background .22s ease;
  }
  .switch::after {
    content: ""; position: absolute; top: 2.5px; left: 2.5px; width: 23px; height: 23px; border-radius: 50%; background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: transform .25s var(--ease-out);
  }
  .switch:checked { background: var(--grad); }
  .switch:checked::after { transform: translateX(18px); }
  .switch:disabled { opacity: .5; }

  /* Wallpaper cards. */
  .hero { position: relative; margin-top: 14px; border-radius: 22px; overflow: hidden; background: var(--fill); aspect-ratio: 21 / 10;
    border: 1px solid var(--hair); }
  .hero img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .hero .cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 44px 16px 13px; color: #fff;
    background: linear-gradient(to top, rgba(0,0,0,.86) 34%, rgba(0,0,0,0));
  }
  .hero .cap small { display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; opacity: .78; }
  .hero .cap b { font-size: 16.5px; font-weight: 600; }
  /* Cells start at the top: a button centres its content, so a tile without a caption sat lower than its neighbour. */
  .grid {
    display: flex; gap: 12px; align-items: flex-start; margin: 0; padding: 3px 16px 6px 3px;
    overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .grid::-webkit-scrollbar { display: none; }
  .wp { position: relative; display: block; border: 0; padding: 0; background: none; text-align: left; min-width: 0;
    flex: 0 0 200px; scroll-snap-align: start; }
  .wp .pic {
    position: relative; border-radius: 18px; overflow: hidden; background: var(--fill); aspect-ratio: 16 / 9.5;
    transition: transform .16s var(--ease-out), box-shadow .2s ease;
  }
  .wp .pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .wp:active .pic { transform: scale(.97); }
  .wp[aria-selected="true"] .pic { box-shadow: 0 0 0 2.5px var(--bg), 0 0 0 5px var(--tint), 0 8px 24px rgba(91,140,255,.28); }
  .wp .t { font-size: 13.5px; font-weight: 600; margin: 8px 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wp .c { font-size: 11.5px; color: var(--secondary); margin: 2px 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .check {
    position: absolute; top: 7px; right: 7px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--tint); color: #fff; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.3); opacity: 0; transform: scale(.8);
    transition: opacity .15s ease, transform .2s var(--ease-out);
  }
  .wp[aria-selected="true"] .check { opacity: 1; transform: none; }
  .badge {
    position: absolute; top: 7px; left: 7px; width: 28px; height: 28px; border-radius: 50%; border: 0; padding: 0;
    background: rgba(0,0,0,.5); color: #fff; display: flex; align-items: center; justify-content: center;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: transform .16s var(--ease-out);
  }
  .badge:active { transform: scale(.9); }
  .tag { position: absolute; left: 7px; bottom: 7px; font-size: 11px; font-weight: 600; color: #fff; padding: 2px 7px; border-radius: 6px; background: rgba(0,0,0,.5); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px; border: 0; border-radius: 14px;
    background: var(--grad); color: #fff; font-weight: 600; text-decoration: none; cursor: pointer;
    box-shadow: 0 8px 20px rgba(74,110,255,.22);
    transition: transform .16s var(--ease-out), opacity .2s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn[disabled] { opacity: .6; pointer-events: none; }
  .btn.plain { background: var(--card); color: var(--tint); box-shadow: none; border: 1px solid var(--hair); }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  .row .btn { flex: 1; }
  .add { margin: 18px 0 16px; }
  .empty { color: var(--secondary); font-size: 15px; padding: 4px 4px 0; margin: 0; }
  .link { appearance: none; border: 0; background: none; color: var(--tint); padding: 0; cursor: pointer; }

  /* Screensaver modes as cards: icon, name, one line of what it does. */
  #ss { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; background: none; border: 0; overflow: visible; }
  #ss .item {
    display: flex; flex-direction: column; align-items: flex-start; gap: 0; min-height: 0;
    padding: 13px 13px 14px; background: var(--card); border: 1px solid var(--hair); border-radius: 18px;
  }
  #ss .item + .item::before { display: none; }
  #ss .item .txt { display: flex; flex-direction: column; width: 100%; }
  #ss .item .txt::before { display: block; font-size: 19px; line-height: 1; margin-bottom: 10px; }
  #ss [data-mode="aerial"] .txt::before { content: "🏞"; }
  #ss [data-mode="photos"] .txt::before { content: "🖼"; }
  #ss [data-mode="clock"] .txt::before { content: "🕐"; }
  #ss [data-mode="videos"] .txt::before { content: "🎬"; }
  #ss .item .txt > span:first-child { font-size: 14px; font-weight: 600; }
  #ss .item .sub {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    font-size: 11.5px; line-height: 1.45; margin-top: 3px;
  }
  #ss .item .tick { position: absolute; top: 13px; right: 13px; width: 15px; height: 15px; }
  #ss .item[aria-checked="true"] {
    border: 1.5px solid transparent;
    background: linear-gradient(var(--card), var(--card)) padding-box, var(--grad) border-box;
  }
  #ss .item[aria-checked="true"] .txt > span:first-child { color: #7fa8ff; }

  .wx { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; row-gap: 2px; }
  .wx b { font-size: 30px; font-weight: 300; letter-spacing: -.02em; }
  .wx span { color: var(--secondary); font-size: 15px; }
  .field { display: flex; align-items: center; gap: 8px; }
  .field { gap: 10px; }
  .field input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--label);
    background: rgba(255,255,255,.06); border: 1px solid var(--hair); border-radius: 12px; outline: none; padding: 9px 12px;
  }
  .field input::placeholder { color: var(--tertiary); }
  .field .link { font-weight: 600; }
  .field .link[disabled] { opacity: .4; }
  /* A <pre>, not a textarea: focusing a field under 16px makes iOS zoom and scroll the page. */
  .diag {
    display: block; height: 220px; margin: 10px 0 0; overflow: auto; -webkit-overflow-scrolling: touch;
    font: 12px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word;
    -webkit-user-select: text; user-select: text;
    color: var(--label); background: var(--card); border: 1px solid var(--hair); border-radius: 16px; padding: 12px;
  }

  /* Tab bar. */
  nav {
    position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 10;
    max-width: calc(100% - 24px); display: flex; align-items: center; gap: 2px; padding: 7px;
    background: var(--bar); border: 1px solid rgba(255,255,255,.09); border-radius: 99px;
    box-shadow: 0 14px 34px rgba(0,0,0,.55);
    -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px);
  }
  /* The answers to a city search, in a sheet of their own, hanging right under the field they
     answer to — wherever the page is scrolled to, over everything behind it (the owner, 11-03). */
  #cityHits {
    position: absolute; left: 50%; transform: translateX(-50%); z-index: 60;
    width: min(calc(100% - 32px), 688px); margin: 0;
    max-height: 430px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--card2); border-radius: 18px; border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 20px 48px rgba(0,0,0,.6);
  }
  #cityHits .item + .item { box-shadow: inset 0 1px 0 var(--sep); }
  #cityHits .item:active { background: var(--fill); }
  #cityHits .act { white-space: nowrap; }
  nav button {
    flex: 0 0 auto; max-width: none; border: 0; background: none; padding: 9px 17px; border-radius: 99px; color: var(--secondary);
    display: flex; flex-direction: row; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    white-space: nowrap; transition: background .18s ease, color .18s ease;
  }
  nav button svg { width: 20px; height: 20px; transition: transform .16s var(--ease-out); }
  nav button:active svg { transform: scale(.88); }
  nav button[aria-selected="true"] { color: #fff; background: var(--grad); box-shadow: 0 8px 18px rgba(88,124,255,.32); }

  /* Bottom sheet. Enters on the drawer curve; leaves faster than it came. */
  .back { display: inline-flex; align-items: center; gap: 3px; font-size: 17px; margin: 0 0 6px -2px; }
  .arow { min-height: 60px; background: var(--card); }
  .arow .thumb { width: 64px; }
  .arow .act { flex-shrink: 0; font-weight: 600; }
  /* Home as on the TV: as many tiles a row (--cols, Personalize on the TV), the first on a shelf. */
  .agrid {
    position: relative; display: grid; grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); gap: 14px 7px;
    padding: 14px 12px 16px; background: var(--card); border-radius: 20px; border: 1px solid var(--hair);
  }
  .agrid .shelf { position: absolute; left: 4px; right: 4px; top: 4px; border-radius: 11px; background: var(--fill); pointer-events: none; }
  .atile {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; cursor: grab;
    touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .atile .tpic {
    width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: var(--fill);
    box-shadow: 0 1px 3px rgba(0,0,0,.35); transition: transform .16s var(--ease-out), box-shadow .2s ease;
  }
  .atile .tpic img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
  .atile .n { width: 100%; font-size: 10.5px; line-height: 1.25; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .atile:active .tpic { transform: scale(.95); }
  .agrid.sorting .atile:not(.lift) { transition: transform .26s var(--ease-out); }
  .atile.lift { z-index: 3; cursor: grabbing; }
  .atile.lift .tpic { transform: scale(1.14); box-shadow: 0 14px 30px rgba(0,0,0,.32), 0 3px 8px rgba(0,0,0,.18); }
  .atile.lift .n { opacity: 0; }
  .icon-sq { width: 30px; height: 30px; border-radius: 7px; background: var(--tint); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
  .sheet-wrap { position: fixed; inset: 0; z-index: 20; }
  .scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .2s ease; }
  /* Into a folder from the right; back out of it from the left, the way it went. */
  .view.push { animation: push .26s var(--ease-out); }
  .view.pop { animation: pop .26s var(--ease-out); }
  @keyframes push { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
  .sheet {
    border: 1px solid var(--hair); box-shadow: 0 -18px 50px rgba(0,0,0,.5);
    max-height: calc(100% - env(safe-area-inset-top) - 24px); overflow-y: auto; overscroll-behavior: contain;
    position: absolute; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; background: var(--sheet);
    border-radius: 14px 14px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .2s var(--ease-out);
  }
  .sheet-wrap.open .scrim { opacity: 1; transition-duration: .3s; }
  .sheet-wrap.open .sheet { transform: none; transition: transform .38s var(--ease-drawer); }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--tertiary); margin: 0 auto 14px; }
  .sheet .pic { border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; background: var(--fill); width: 62%; margin: 0 auto; }
  .sheet .pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .item .ithumb { width: 64px; aspect-ratio: 16 / 9; border-radius: 6px; object-fit: cover; margin-right: 12px; flex: none; background: var(--fill); }
  .sheet h3 { text-align: center; font-size: 17px; font-weight: 600; margin: 12px 0 2px; }
  .sheet .meta { text-align: center; font-size: 13px; color: var(--secondary); margin: 0 0 16px; }
  .sheet .list { background: var(--card); }
  .sheet .list + .list { margin-top: 10px; }

  .toast {
    position: fixed; z-index: 30; left: 50%; bottom: calc(var(--tabbar) + 16px); transform: translate(-50%, 12px);
    background: rgba(30,30,30,.92); color: #fff; padding: 10px 18px; border-radius: 22px; font-size: 15px; max-width: calc(100% - 32px);
    opacity: 0; transition: opacity .2s ease, transform .3s var(--ease-out); pointer-events: none;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  /* Dropping files anywhere on the page: photos become wallpapers, videos go to the screensaver. */
  .drop {
    position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    background: var(--scrim); color: #fff; pointer-events: none; opacity: 0; transition: opacity .15s ease;
  }
  .drop.on { opacity: 1; }
  /* The TV unreachable: the page keeps polling, so this says why nothing answers. */
  .banner {
    margin: 0 0 14px; padding: 12px 16px; border-radius: 16px; background: rgba(255,90,82,.1);
    border: 1px solid rgba(255,90,82,.22); color: #ff9b95; font-size: 13.5px; text-align: center;
  }
  .drop b { font-size: 24px; font-weight: 600; padding: 28px 40px 0; border: 2px dashed rgba(255,255,255,.7); border-bottom: 0; border-radius: 18px 18px 0 0; }
  .drop span { font-size: 15px; opacity: .85; padding: 0 40px 28px; border: 2px dashed rgba(255,255,255,.7); border-top: 0; border-radius: 0 0 18px 18px; }

  /* A computer's browser: the tabs down the side, a wider page, dialogs in the middle. */
  @media (hover: hover) and (pointer: fine) {
    button.item:hover, label.item:hover { background: var(--fill); }
    .wp:hover .pic { transform: scale(1.02); }
    .btn:hover { filter: brightness(1.06); }
    nav button:hover { color: var(--label); }
    .atile:hover .tpic { box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  }
  @media (min-width: 900px) {
    :root { --side: 220px; }
    main { max-width: 1040px; margin: 0 0 0 var(--side); padding: 12px 40px 48px; }
    @media (min-width: 1320px) { main { margin-left: calc(var(--side) + (100vw - var(--side) - 1040px) / 2); } }
    header { padding-top: 32px; }
    nav {
      top: 0; right: auto; bottom: 0; width: var(--side); height: auto; padding: 88px 12px 0;
      flex-direction: column; justify-content: flex-start; gap: 4px; box-shadow: .5px 0 0 var(--bar-line);
    }
    nav button {
      flex: none; max-width: none; flex-direction: row; gap: 12px; padding: 9px 12px; border-radius: 10px;
      font-size: 15px; font-weight: 500; color: var(--label);
    }
    nav button svg { width: 22px; height: 22px; color: var(--secondary); }
    nav { transform: none; left: 0; border: 0; border-radius: 0; max-width: none; padding: 88px 12px 0; box-shadow: .5px 0 0 var(--bar-line); }
    nav button { justify-content: flex-start; border-radius: 10px; padding: 9px 12px; font-size: 15px; }
    nav button[aria-selected="true"] { background: var(--fill); color: #fff; box-shadow: none; }
    nav button[aria-selected="true"] svg { color: #fff; }
    nav button[aria-selected="true"] svg { color: var(--tint); }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px 16px;
      margin: 0; padding: 0; overflow: visible;
    }
    .wp { flex: none; }
    .hero { max-width: 720px; }
    .agrid { gap: 18px 12px; padding: 16px 16px 18px; }
    .atile .n { font-size: 12.5px; }
    .add { max-width: 320px; }
    .sheet {
      top: 50%; bottom: auto; left: 50%; right: auto; width: 520px; max-height: calc(100% - 80px);
      border-radius: 20px; padding: 18px 20px 20px; transform: translate(-50%, -46%); opacity: 0;
      transition: transform .2s var(--ease-out), opacity .15s ease; box-shadow: 0 24px 60px rgba(0,0,0,.3);
    }
    .sheet-wrap.open .sheet { transform: translate(-50%, -50%); opacity: 1; transition: transform .26s var(--ease-out), opacity .2s ease; }
    .grab { display: none; }
    .toast { bottom: 28px; left: calc(50% + var(--side) / 2); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .sheet-wrap.open .sheet { transition: none; }
    .view.push, .view.pop { animation: none; }

  .crop-foot p { margin: 2px 0 0; font-size: 12.5px; color: rgba(255,255,255,.68); text-align: center; }
  /* A QR code opened this tab at one thing: point at it. */
  .glow { animation: glow 1.1s ease 2; }

/*
 * Pull the sheet down to close it, as on iOS. A flick is enough (by speed, not distance); a slow
 * pull closes it past a third of its height, otherwise it springs back. Only from its top, so a
 * long sheet still scrolls, and only the first finger counts.
 */
(() => {
  const panel = sheet.querySelector('.sheet');
  let id = null, x0 = 0, y0 = 0, t0 = 0, dy = 0, dragging = false;
  const touch = e => [...e.changedTouches].find(t => t.identifier === id);

      const s = scale();

      img.style.transform = `translate(calc(-50% + ${view.tx}px), calc(-50% + ${view.ty}px))`;
    };
    const layout = () => {
      const w = Math.max(120, Math.min(innerWidth - 20, (innerHeight - 200) * outW / outH));
      view.W = w; view.H = w * outH / outW;
      stage.style.width = view.W + 'px'; stage.style.height = view.H + 'px';
      clamp(); paint();
    };
    const settle = (z, fresh) => {
      view.zoom = z;
      if (fresh) { view.tx = 0; view.ty = 0; }
      clamp(); paint();
    };
    const result = () => {
      const s = scale();
      // The picture's left edge in stage pixels, then the frame in the picture's own.
      const sx = -(view.W / 2 + view.tx - view.natW * s / 2) / s;
      const sy = -(view.H / 2 + view.ty - view.natH * s / 2) / s;
      const c = document.createElement('canvas');
      c.width = outW; c.height = outH;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, sx, sy, view.W / s, view.H / s, 0, 0, outW, outH);
      return new Promise(ok => c.toBlob(b => ok(b), 'image/jpeg', 0.92));
    };

    $('#cropTitle').textContent = title;
    $('#cropSave').disabled = false;
    zoom.oninput = e => settle(e.target.value / 100);
    $('#cropSave').onclick = async () => {
      $('#cropSave').disabled = true;
      const blob = await result();
      if (!blob) { toast(t('toast_crop_fail')); $('#cropSave').disabled = false; return; }
      done(new File([blob], (file.name || 'photo').replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }));
    };
    $('#cropCancel').onclick = () => done(null);
    // One finger moves the picture; the slider zooms. The frame never lets the picture slip off.
    let drag = null;
    stage.onpointerdown = e => { drag = { id: e.pointerId, x: e.clientX, y: e.clientY }; stage.setPointerCapture && stage.setPointerCapture(e.pointerId); };
    stage.onpointermove = e => {
      if (!drag || e.pointerId !== drag.id) return;
      view.tx += e.clientX - drag.x; view.ty += e.clientY - drag.y;
      drag.x = e.clientX; drag.y = e.clientY;
      clamp(); paint();
    };
    const up = e => { if (drag && e.pointerId === drag.id) drag = null; };
    stage.onpointerup = up; stage.onpointercancel = up;
    addEventListener('resize', () => { if (!box.hidden) layout(); }, { passive: true });

    img.onload = () => {
      view.natW = img.naturalWidth; view.natH = img.naturalHeight;
      box.hidden = false; document.body.style.overflow = 'hidden';
      layout(); settle(1, true);
    };
    img.onerror = () => { done(null); toast(t('toast_crop_fail')); };
    img.src = url;
  });
}

// The phone's own fix, and nothing else: behind a proxy an address hands back the proxy's town, and
// a tap that quietly moved the weather to another country is worse than one that says it could not
// find the phone (the owner, 11-03). The city is then named by the search above.
$('#wxLocate').onclick = async () => {
  const btn = $('#wxLocate'); btn.disabled = true;
  const located = async (lat, lon, acc) => {
    const next = await api('api/weather/locate', { lat: lat.toFixed(5), lon: lon.toFixed(5), acc: String(acc) });
    take(next); toast(t('toast_locate_ok', { place: placeText(next.weather) }));
  };
  try {
    // Over plain http a browser will not read the phone's location at all: the tap moves the page
    // to its https twin (same token, five ports up), where the certificate is asked about once and
    // the location can be read (the owner, 11-03: no dead ends — the search stays where it was).
    if (!window.isSecureContext) {
      const m = location.host.match(/^(.+):(\d+)$/);
      const host = m ? m[1] : location.hostname;
      const port = (m ? parseInt(m[2], 10) : 80) + 5;
      try { sessionStorage.setItem('wx-locate-want', '1'); } catch (e) {}
      location.href = `https://${host}:${port}${location.pathname}${location.hash}`;
      return;
    }
    if (!navigator.geolocation) throw new Error('no geolocation');
    const pos = await new Promise((ok, no) => navigator.geolocation.getCurrentPosition(ok, no, { enableHighAccuracy: true, timeout: 15000, maximumAge: 600000 }));
    await located(pos.coords.latitude, pos.coords.longitude, Math.round(pos.coords.accuracy));
  } catch (err) {
    // Nothing found: say so, and let the search above name the city — a guessed town from the
    // proxy would be worse than none.
    toast(t('toast_locate_fail'));
  }
  btn.disabled = false;
};

try {
  if (window.isSecureContext && sessionStorage.getItem('wx-locate-want') === '1') {
    sessionStorage.removeItem('wx-locate-want');

function tileImg(e) { const i = el('img', 'thumb'); i.alt = ''; i.loading = 'lazy'; i.src = `${base}tile/${encodeURIComponent(e.key)}?v=${e.stamp}`; return i; }

async function lay(params, done) {
  try {
    const next = await api('api/layout', params);
    if (!next.saved) throw new Error('not saved');
    take(next); if (done) done(next);
  } catch (e) { toast(t('toast_set_fail')); stateJson = ''; render(); }
}
function folderNameOf(next, key) {
  const L = next.layout || {}; const f = Object.keys(L.folders || {}).find(id => (L.folders[id] || []).some(a => a.key === key));
  const tile = f && (L.home || []).find(e => e.id === f); return tile ? tile.label : '';
}

/* push: true going into a folder, 'back' coming out of one, false for no motion. */
function renderArrange(push) {
  if (arrDragging) { arrPending = true; return; }
  const L = state.layout || { home: [], folders: {}, hidden: [] };
  if (arrView !== null && !(L.folders || {})[arrView]) arrView = null;   // ungrouped, or emptied
  const folderTile = arrView !== null ? L.home.find(e => e.id === arrView) : null;
  const view = el('div', 'view' + (push === 'back' ? ' pop' : push ? ' push' : ''));
  if (!L.ready) view.appendChild(el('p', 'foot', t('arrange_unready'))).style.marginTop = '20px';
  if (folderTile) buildFolderView(view, folderTile, L.folders[arrView] || []);
  else buildHomeView(view, L);
  $('#homeBody').replaceChildren(view);
  $('#inputsBox').hidden = !(state.inputs || []).length || !!folderTile;
  if (tab) setTitle();
  placeShelves();
  if (push) window.scrollTo(0, 0);
}

function buildHomeView(view, L) {
  const grid = tileGrid(L.home, true); grid.style.marginTop = '14px'; view.appendChild(grid);
  sortableGrid(grid, L.home.map(e => e.key),
    (key, target) => lay({ op: 'move', key, target }),
    i => { const e = L.home[i]; e.kind === 'folder' ? (arrView = e.id, renderArrange(true)) : tileSheet(e, null); });
  view.appendChild(el('p', 'foot', t('arrange_hint')));

  view.appendChild(el('h2', '', t('hidden_h')));
  if (L.locked && L.hiddenCount) { view.appendChild(el('p', 'foot', t('hidden_locked', { n: L.hiddenCount }))); return; }
  if (!L.hidden.length) { view.appendChild(el('p', 'foot', t('hidden_none'))); return; }
  const hl = el('div', 'list'); view.appendChild(hl);
  for (const e of L.hidden) {
    const row = el('div', 'item arow'); row.setAttribute('role', 'button'); row.tabIndex = 0;
    row.append(tileImg(e), el('span', 'txt', e.label));
    const b = el('button', 'link act', t('show_app'));
    b.onclick = ev => { ev.stopPropagation(); b.disabled = true; lay({ op: 'unhide', key: e.key }, () => toast(t('toast_shown'))); };
    row.onclick = () => tileSheet(e, null, true);
    row.appendChild(b); hl.appendChild(row);
  }
}

function buildFolderView(view, folder, apps) {
  // The folder's name, edited in place.
  view.appendChild(el('h2', '', t('folder_ph')));
  const nl = el('div', 'list'); view.appendChild(nl);
  const form = el('form', 'item field');
  const input = el('input'); input.type = 'text'; input.value = folder.label; input.maxLength = 24; input.placeholder = t('folder_ph');
  input.setAttribute('enterkeyhint', 'done'); input.autocomplete = 'off'; input.setAttribute('aria-label', t('folder_ph'));
  const save = el('button', 'link', t('save'));
  const sync = () => save.disabled = !input.value.trim() || input.value.trim() === folder.label;
  input.oninput = sync; sync(); form.append(input, save); nl.appendChild(form);
  form.onsubmit = async e => {
    e.preventDefault(); const name = input.value.trim(); if (!name) return; input.blur();
    try { const next = await api('api/folder/name', { id: folder.id, name }); take(next); toast(t(next.saved ? 'toast_folder_renamed' : 'toast_rename_fail')); }
    catch (err) { toast(t('toast_rename_fail')); }
  };

  view.appendChild(el('h2', '', t('folder_count', { n: apps.length })));
  const grid = tileGrid(apps, false); view.appendChild(grid);
  sortableGrid(grid, apps.map(e => e.key), (key, target) => lay({ op: 'movein', key, target }), i => tileSheet(apps[i], folder));
  view.appendChild(el('p', 'foot', t('folder_hint')));

  const al = el('div', 'list'); al.style.marginTop = '28px'; view.appendChild(al);
  action(al, t('ungroup'), 'danger', () => openSheet(body => {
    body.appendChild(el('h3', '', t('ungroup_confirm', { name: folder.label }))).style.marginBottom = '16px';
    const l = el('div', 'list'); body.appendChild(l);
    action(l, t('ungroup'), 'danger', () => { closeSheet(); lay({ op: 'ungroup', folder: folder.id }, () => toast(t('toast_ungrouped'))); });
    const c = el('div', 'list'); body.appendChild(c);
    action(c, t('cancel'), 'tint', closeSheet).style.fontWeight = '600';
  }));
}

function tileGrid(entries, shelf) {
  const grid = el('div', 'agrid');
  grid.style.setProperty('--cols', homeCols());
  if (shelf && entries.length) grid.appendChild(el('div', 'shelf'));
  for (const e of entries) {
    const tile = el('div', 'atile'); tile.dataset.key = e.key; tile.setAttribute('role', 'button'); tile.tabIndex = 0;
    tile.setAttribute('aria-label', e.label);
    const pic = el('div', 'tpic'); const img = el('img'); img.alt = ''; img.draggable = false; img.loading = 'lazy';
    img.src = `${base}tile/${encodeURIComponent(e.key)}?v=${e.stamp}`; pic.appendChild(img);
    tile.append(pic, el('span', 'n', e.label));
    grid.appendChild(tile);
  }

}
/* Apps a row on the TV's Home. */
function homeCols() { return (state.layout && state.layout.columns) || 5; }
/* The shelf sits behind Home's first row, as the glass plate does on the TV. */
function placeShelves() {
  document.querySelectorAll('#homeBody .agrid').forEach(g => {
    const shelf = g.querySelector('.shelf'); if (!shelf) return;
    const first = [...g.querySelectorAll('.atile')].slice(0, homeCols());
    const bottom = Math.max(...first.map(t => t.offsetTop + t.offsetHeight));
    shelf.style.height = (bottom + 6 - 4) + 'px';
  });
}
addEventListener('resize', placeShelves);

/*
 * Everything one tile can do, in one sheet: its name, its picture, its folder, whether Home shows it.
 * An input's name goes to the input (as from its menu on the TV); an app's to the app.
 */
function tileSheet(e, inFolder, hidden) {
  const a = (state.apps || []).find(x => x.key === e.key) || { key: e.key, label: e.label, default: e.label, name: '' };
  const L = state.layout || {};
  const folders = (L.home || []).filter(x => x.kind === 'folder' && (!inFolder || x.id !== inFolder.id));
  openSheet(body => {
    const pic = el('div', 'pic'); const img = el('img'); img.src = `${base}tile/${encodeURIComponent(e.key)}?v=${e.stamp}`; pic.appendChild(img); body.appendChild(pic);
    body.appendChild(el('h3', '', e.label));
    const meta = [a.source ? (a.label === a.port ? t('tag_source') : a.port) : a.name ? t('was_named', { name: a.default }) : '', inFolder ? inFolder.label : ''].filter(Boolean).join(' · ');
    body.appendChild(el('p', 'meta', meta));

    // Name.
    const nl = el('div', 'list'); body.appendChild(nl);
    const f = el('form', 'item field');
    const input = el('input'); input.type = 'text'; input.value = a.name || ''; input.maxLength = 24;
    input.placeholder = a.source ? t('name_ph') : (a.default || a.label);
    input.setAttribute('enterkeyhint', 'done'); input.autocomplete = 'off'; input.setAttribute('aria-label', t('aria_rename'));
    const save = el('button', 'link', t('save'));
    const sync = () => save.disabled = input.value.trim() === (a.name || '');
    input.oninput = sync; sync();
    f.append(input, save); nl.appendChild(f);
    f.onsubmit = async ev => {
      ev.preventDefault(); const name = input.value; closeSheet();
      try {
        const next = await api('api/app/name', { app: a.key, name });
        if (!next.saved) throw new Error('not saved');
        take(next); toast(t(name.trim() ? 'toast_renamed' : 'toast_name_reset'));
      } catch (err) { toast(t('toast_rename_fail')); }
    };
    body.appendChild(el('p', 'foot', a.source ? t('rename_hint') : t('rename_hint_app', { name: a.default || a.label }))).style.marginBottom = '12px';

    // Picture: for an input, the device plugged into it first (as in its menu on the TV).
    const il = el('div', 'list'); body.appendChild(il);
    if (a.source) {
      const cur = (state.devices || []).find(d => d.key === a.device);
      const b = el('button', 'item');
      b.append(el('span', 'txt', t('source_device')), el('span', 'val', cur ? cur.label : t('source_plain')));
      b.insertAdjacentHTML('beforeend', ICON.chev);
      b.onclick = () => deviceChooser(a, e);
      il.appendChild(b);
    }
    // Where the picture comes from, when the icon library has one for this app: its picture,
    // the app's own art, or the one sent from this phone.
    if (!a.source && a.library) {
      const choices = [
        { pick: 'library', label: t('icon_library'), src: `${base}library/${encodeURIComponent(a.key)}?v=${a.stamp}` },
        { pick: 'own', label: t('icon_own'), src: `${base}tile/${encodeURIComponent(a.key)}?art=own&v=${a.stamp}` },
      ];
      if (a.custom) choices.push({ pick: 'custom', label: t('icon_custom'), src: `${base}tile/${encodeURIComponent(a.key)}?v=${a.stamp}` });
      const cl = el('div', 'list'); cl.setAttribute('role', 'radiogroup'); cl.setAttribute('aria-label', t('icon_h'));
      il.before(cl); cl.style.marginBottom = '10px';
      for (const c of choices) {
        const b = el('button', 'item'); b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', String(a.icon === c.pick));
        const img = el('img', 'ithumb'); img.alt = ''; img.src = c.src;
        b.append(img, el('span', 'txt', c.label));
        b.insertAdjacentHTML('beforeend', ICON.tick);
        b.onclick = async () => {
          // The tick moves only when the answer is back: closing first looked like "not
          // switching" whenever the sheet was reopened before the round trip. "custom" puts a
          // sent picture back in front; nothing here ever deletes it.
          if (a.icon === c.pick) { closeSheet(); return; }
          b.disabled = true;
          try {
            const next = await api('api/icon/pick', { app: a.key, pick: c.pick });
            if (!next.saved) throw new Error('not saved');
            take(next); changedIcons.add(a.key); toast(t('toast_icon_picked')); closeSheet();
          } catch (err) { toast(t('toast_set_fail')); b.disabled = false; }
        };
        cl.appendChild(b);
      }
    }
    // The picker opens from this tap, so iOS treats it as the user's own gesture.
    action(il, t('change_icon'), 'tint', () => { iconFor = a; $('#iconFile').click(); closeSheet(); });
    if (a.custom) action(il, t('aria_reset_icon'), 'tint', async () => {
      closeSheet();
      try { take(await api('api/icon/reset', { app: a.key })); changedIcons.add(a.key); toast(t('toast_icon_reset')); } catch (err) { toast(t('toast_set_fail')); }
    });
    // The picture the last change replaced is kept whatever it was — a sent picture, the
    // library's, the app's own — and this puts it back, so a choice is never a dead end.
    // Only after a change made on this page: a record the TV kept from an earlier run is not
    // something the owner asking for it now remembers making, and the row would look like a bug.
    if (a.prev && changedIcons.has(a.key)) action(il, t('icon_prev'), 'tint', async () => {
      closeSheet();
      try { const next = await api('api/icon/undo', { app: a.key }); if (!next.saved) throw new Error('not saved'); take(next); toast(t('toast_icon_prev')); }
      catch (err) { toast(t('toast_set_fail')); }
    });

    // Place on Home.
    const pl = el('div', 'list'); pl.style.marginTop = '12px'; body.appendChild(pl);
    if (hidden) {
      action(pl, t('show_on_home'), 'tint', () => { closeSheet(); lay({ op: 'unhide', key: e.key }, () => toast(t('toast_shown'))); });
    } else {
      action(pl, t('to_folder'), 'tint', () => folderChooser(e, folders));
      if (inFolder) action(pl, t('out_of_folder'), 'tint', () => { closeSheet(); lay({ op: 'unfolder', key: e.key }, () => toast(t('toast_out_folder'))); });
      action(pl, t('hide_app'), 'danger', () => { closeSheet(); lay({ op: 'hide', key: e.key }, () => toast(t('toast_hidden'))); });
    }
    const c = el('div', 'list'); c.style.marginTop = '12px'; body.appendChild(c);
    action(c, t('cancel'), 'tint', closeSheet).style.fontWeight = '600';
  });
}
/* The device on an input: its mark and colours on the tile, its name on the caption (as on the TV). */
function deviceChooser(a, e) {
  const body = $('#sheetBody'); body.replaceChildren();
  body.appendChild(el('h3', '', t('source_device'))); body.appendChild(el('p', 'meta', a.port || e.label));
  const l = el('div', 'list'); body.appendChild(l);
  const choices = [{ key: '', label: t('source_plain'), sub: a.port }].concat(state.devices || []);
  for (const d of choices) {
    const b = el('button', 'item'); b.setAttribute('role', 'radio');
    const txt = el('span', 'txt', d.label); if (d.sub) txt.appendChild(el('span', 'sub', d.sub));
    b.appendChild(txt); b.insertAdjacentHTML('beforeend', ICON.tick);
    b.setAttribute('aria-checked', (a.device || '') === d.key ? 'true' : 'false');
    b.onclick = async () => {
      closeSheet();
      if ((a.device || '') === d.key) return;
      try {
        const next = await api('api/source/device', { app: a.key, device: d.key });
        if (!next.saved) throw new Error('not saved');
        take(next); toast(t('toast_tv_updated'));
      } catch (err) { toast(t('toast_set_fail')); }

    l.appendChild(b);
  }
  body.appendChild(el('p', 'foot', t('source_device_hint'))).style.marginBottom = '12px';
  const c = el('div', 'list'); body.appendChild(c);

}
function folderChooser(e, folders) {
  const body = $('#sheetBody'); body.replaceChildren();
  body.appendChild(el('h3', '', t('to_folder'))); body.appendChild(el('p', 'meta', e.label));
  const l = el('div', 'list'); body.appendChild(l);
  const go = id => { closeSheet(); lay({ op: 'folder', key: e.key, folder: id || '' }, next => toast(t('toast_in_folder', { name: folderNameOf(next, e.key) }))); };
  for (const f of folders) {
    const b = el('button', 'item'); b.append(tileImg(f), el('span', 'txt', f.label)); b.onclick = () => go(f.id); l.appendChild(b);
  }
  const n = el('button', 'item tint'); n.innerHTML = ICON.plus; n.appendChild(el('span', 'txt', t('new_folder'))); n.onclick = () => go(''); l.appendChild(n);
  const c = el('div', 'list'); body.appendChild(c);
  action(c, t('cancel'), 'tint', closeSheet).style.fontWeight = '600';
}

/*
 * Drag a tile to its place, as moving one on the TV. A touch picks the tile up after a short hold
 * (a quick swipe still scrolls the page); a mouse picks it up as soon as it moves. The tile follows
 * the finger with no easing (it is under the finger), the others slide to their new slots on an
 * interruptible transition, and near the top or bottom the page scrolls. On release the tile settles
 * into its slot and the grid takes the new order at once; the TV is told after. A tap is a tap.
 * A second finger is ignored while one tile is held.
 */
/*
 * A tap opens its sheet on the lift, and the phone's browser sends the tap's click a moment later,
 * hit-tested again: it landed on the scrim that had just appeared and closed the sheet at once, or
 * on one of the sheet's buttons (issue #542, Chrome, WeChat and Samsung Internet on Android).
 */
function swallowNextClick() {
  const until = performance.now() + 600;
  const h = e => {
    document.removeEventListener('click', h, true);
    if (performance.now() < until) { e.preventDefault(); e.stopPropagation(); }
  };
  document.addEventListener('click', h, true);
  setTimeout(() => document.removeEventListener('click', h, true), 700);
}

function sortableGrid(grid, keys, onMove, onTap) {
  grid.addEventListener('pointerdown', ev => {
    const tile = ev.target.closest('.atile'); if (!tile || arrDragging || ev.button > 0) return;
    const tiles = [...grid.querySelectorAll('.atile')]; const from = tiles.indexOf(tile);
    const pid = ev.pointerId, touch = ev.pointerType !== 'mouse';
    const sx = ev.clientX, sy = ev.clientY;
    let x = sx, y = sy, lifted = false, ended = false, timer = 0, raf = 0, to = from;
    let cells = [], g0 = null;
    const blockScroll = e => { if (lifted) e.preventDefault(); };

    const lift = () => {
      lifted = true; arrDragging = true;
      try { tile.setPointerCapture(pid); } catch (e) {}
      document.addEventListener('touchmove', blockScroll, { passive: false });
      cells = tiles.map(t => ({ x: t.offsetLeft, y: t.offsetTop, w: t.offsetWidth, h: t.offsetHeight }));
      const r = grid.getBoundingClientRect(); g0 = { x: sx - r.left, y: sy - r.top };
      grid.classList.add('sorting'); tile.classList.add('lift');
      try { navigator.vibrate && navigator.vibrate(10); } catch (e) {}
      raf = requestAnimationFrame(edge);
    };
    const slotAt = (px, py) => {
      let best = from, bd = Infinity;
      cells.forEach((c, i) => { const d = (c.x + c.w / 2 - px) ** 2 + (c.y + c.h / 2 - py) ** 2; if (d < bd) { bd = d; best = i; } });
      return best;
    };
    const place = () => {
      const r = grid.getBoundingClientRect(); const gx = x - r.left, gy = y - r.top;
      tile.style.transform = `translate(${gx - g0.x}px, ${gy - g0.y}px)`;
      const next = slotAt(cells[from].x + cells[from].w / 2 + gx - g0.x, cells[from].y + cells[from].h / 2 + gy - g0.y);
      if (next === to) return;
      to = next;
      tiles.forEach((t, j) => {
        if (t === tile) return;
        const k = from < to && j > from && j <= to ? j - 1 : from > to && j >= to && j < from ? j + 1 : j;
        t.style.transform = k === j ? '' : `translate(${cells[k].x - cells[j].x}px, ${cells[k].y - cells[j].y}px)`;
      });
    };
    const edge = () => {
      // The page scrolls; on a phone the tab bar covers its bottom. On a computer the bar is the
      // side bar, whose top is 0: taken for the bottom, it scrolled the page from mid-window (#786).
      const bar = document.querySelector('nav').getBoundingClientRect();
      const top = 0, bottom = bar.top > innerHeight / 2 ? bar.top : innerHeight, zone = 70;
      const v = y < top + zone ? -(top + zone - y) / 4 : y > bottom - zone ? (y - (bottom - zone)) / 4 : 0;
      if (v) { window.scrollBy(0, Math.max(-16, Math.min(16, v))); place(); }
      raf = requestAnimationFrame(edge);
    };
    const finish = () => {
      document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', cancel);
      document.removeEventListener('touchmove', blockScroll);
      clearTimeout(timer); cancelAnimationFrame(raf);
    };
    const drop = () => {
      // Settle into the slot, then take the new order without motion.
      tile.style.transition = reducedMotion() ? 'none' : 'transform .2s var(--ease-out)';
      tile.style.transform = `translate(${cells[to].x - cells[from].x}px, ${cells[to].y - cells[from].y}px)`;
      tile.classList.remove('lift');
      setTimeout(() => {
        grid.classList.remove('sorting');
        tiles.forEach(t => { t.style.transition = 'none'; t.style.transform = ''; });
        if (to !== from) grid.insertBefore(tile, to > from ? tiles[to].nextSibling : tiles[to]);
        void grid.offsetHeight; tiles.forEach(t => t.style.transition = '');
        arrDragging = false;
        if (to !== from) onMove(keys[from], keys[to]);
        else if (arrPending) { arrPending = false; renderArrange(false); }
      }, 200);
    };
    const move = e => {
      if (e.pointerId !== pid) return;
      x = e.clientX; y = e.clientY;
      const far = Math.hypot(x - sx, y - sy);
      if (!lifted) {
        if (touch && far > 8) { ended = true; finish(); }   // a swipe: the page scrolls
        else if (!touch && far > 5) { lift(); place(); }
        return;
      }
      place();
    };
    const up = e => {
      if (e.pointerId !== pid || ended) return;
      ended = true; finish();
      if (lifted) drop(); else { swallowNextClick(); onTap(from); }
    };
    const cancel = e => {
      if (e.pointerId !== pid || ended) return;
      ended = true; finish();
      if (lifted) drop();
    };
    if (touch) timer = setTimeout(() => { if (!ended) { lift(); place(); } }, 260);
    document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', cancel);
  });
  // Keyboard: Enter on a focused tile is a tap.
  grid.addEventListener('keydown', e => {
    const tile = e.target.closest('.atile'); if (!tile || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault(); onTap([...grid.querySelectorAll('.atile')].indexOf(tile));
  });
}

function render() {
  if (!state) return;
  // The page polls; skip the rebuild when nothing changed, so pictures do not flicker and taps are not lost.
  const json = JSON.stringify(state);
  if (json === stateJson) return;
  stateJson = json;
  renderWallpapers();
  renderScreensaver();
  renderMore();
  renderInputs();
  renderArrange(false);
}

initLangSwitch();
applyI18n();

/*
 * The QR code on the TV opens this page with a fragment: #app=<key> for one tile's sheet (its name,
 * its picture), #upload for the photo upload. Anything else is a tab, as it was.
 */
function entryFor(key) {
  const L = (state && state.layout) || {};
  const pool = [...(L.home || []), ...(L.hidden || [])];
  for (const f of Object.values(L.folders || {})) pool.push(...(f.apps || []));
  const row = pool.find(x => x.key === key && x.kind !== 'folder');
  if (row) return row;
  const a = ((state && state.apps) || []).find(x => x.key === key);
  return a ? { key: a.key, label: a.label, stamp: a.stamp } : null;
}
/* Where the code pointed: scroll it in, ring it once, and open what it stands for. */
function pointAt(selector, then) {
  const node = document.querySelector(selector);
  if (!node) return;
  node.scrollIntoView({ block: 'center', behavior: scrollBehavior() });
  node.classList.add('glow');
  setTimeout(() => node.classList.remove('glow'), 2600);
  if (then) setTimeout(then, 480);
}
function bootTab() {
  const raw = (location.hash || '').slice(1);
  let saved = null; try { saved = localStorage.getItem('aerial-tab'); } catch (e) {}
  if (raw.indexOf('app=') === 0) {
    show('home', true);
    const key = decodeURIComponent(raw.slice(4));
    return () => pointAt(`#homeBody .atile[data-key="${key}"]`, () => { const e = entryFor(key); if (e) tileSheet(e, null); });
  }
  if (raw === 'upload') { show('looks', true); return () => pointAt('#sections .btn.add'); }
  // The TV's 添加城市 row: straight to the city search, cursor in the box.
  if (raw === 'weather') { show('more', true); return () => pointAt('#cityForm .field, #city'); }
  show(raw || saved, true);
  return null;
}
const fromQr = bootTab();
async function refresh() {
  try { take(await api('api/state')); lost(false); }
  // The TV asleep, its Wi-Fi changed, or a tab left open overnight: say so instead of sitting
  // still, and the next poll (every six seconds) picks it up again.
  catch (e) { lost(true); }
}
function lost(on) {
  const b = $('#conn'); if (!b) return;
  b.hidden = !on;
  if (on) b.textContent = t('conn_lost');
}
refresh().then(() => { if (fromQr) setTimeout(fromQr, 140); });
setInterval(() => { if (!document.hidden && sheet.hidden && !arrDragging) refresh(); }, 6000);
</script>
